[package]
name = "nodekeeper"
description = "Nodekeeper: a GUI for running Bitcoin Core and ord"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nodekeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Already in the build (tauri-plugin-dialog is built on it, with exactly these
# features); declared directly only so `instance_lock` can show its "already
# running" message box *before* the Tauri app exists.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6", "gtk3"] }
tauri-plugin-notification = "2"
keepawake = "0.6"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
thiserror = { workspace = true }
nk-core = { workspace = true }
nk-store = { workspace = true }
nk-exec = { workspace = true }
nk-proc = { workspace = true }
nk-rpc = { workspace = true }
nk-ord = { workspace = true }
nk-verify = { workspace = true }
nk-scripts = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
zeroize = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
serial_test = { version = "3", features = ["file_locks"] }
