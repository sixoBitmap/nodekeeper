name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      # Working hypothesis (not yet confirmed -- see DECISIONS.md) for
      # repeated windows-latest-only `cargo test` flakiness (nk-testkit's
      # real-bitcoind tests intermittently exceeding a 60s-per-phase
      # startup timeout, even under `#[serial]`-enforced single-instance
      # execution, which rules out cross-binary process concurrency as
      # the cause). Windows Defender's real-time scan of a freshly-
      # extracted, freshly-executed bitcoind.exe is a well-documented
      # source of exactly this kind of first-run latency on Windows CI
      # runners. Excluding the whole checkout (covers both the extracted
      # binary and cargo's own build output) before anything is written
      # to disk.
      - name: Exclude repo from Windows Defender scanning
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}"

      - name: Install Linux Tauri/webkit build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (disallowed-methods enforced)
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::disallowed-methods

      # Bitcoin Core cache, keyed by OS + pinned version (bump the key
      # whenever crates/nk-verify/examples/fetch_bitcoin_core.rs's
      # VERSION changes). Implementation Guide: "CI caches the verified
      # binaries." The fetch step still runs nk-verify's real
      # download+verify path on every run, cache hit or not -- caching
      # only skips the network transfer, never the verification itself.
      - name: Cache Bitcoin Core download
        id: bitcoin-core-cache
        uses: actions/cache@v4
        with:
          path: target/nodekeeper-bitcoin-core-31.1
          key: bitcoin-core-31.1-${{ matrix.os }}

      - name: Fetch and verify Bitcoin Core (for nk-testkit's regtest integration test)
        shell: bash
        run: |
          set -e
          path=$(cargo run --release -p nk-verify --example fetch_bitcoin_core)
          echo "NK_TEST_BITCOIND=$path" >> "$GITHUB_ENV"

      - name: cargo test
        run: cargo test --workspace

      - name: Frontend typecheck / lint / test
        run: |
          npm run typecheck
          npm run lint
          npm run test -- --run
        working-directory: ui

      - name: App builds (tauri build --debug, no bundling)
        # Not `npm run tauri` from ui/: the Tauri CLI only looks for
        # src-tauri/ in subfolders of the current directory, and
        # src-tauri lives at the repo root, not inside ui/ (see
        # Justfile's `build-app` recipe for the same reasoning).
        run: ./ui/node_modules/.bin/tauri build --debug --no-bundle
